<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>iRacing · Car odometer</title>
<style>

.meter[data-style="electronic"]:before,.meter[data-style="mechanical"]:before{display:none}
.meter[data-style="electronic"] .digits{gap:5px;align-items:center;background:linear-gradient(#101909,#080f04);padding:6px 8px;height:48px;border-radius:3px;box-shadow:inset 0 0 8px #000,0 0 0 1px #92b82332}

.pixel{border-radius:50%;background:#71832a12;width:3px;height:3px}
.pixel.lit{background:#d5ff63;box-shadow:0 0 3px #c3fc35c9,0 0 7px #adf12662}

.wheel-column:last-child .wheel{background:linear-gradient(#86918c,#dce0cd 48%,#8c9890)}
.wheel-column:last-child .strip span{color:#15211c;text-shadow:0 1px #ffffff42}
.wheel-separator{width:5px;height:42px}
.meter[data-style="mechanical"] .unit{padding-top:27px}

.meter[data-style="electronic"] .reading{align-items:center}

/* Only the driving viewport is fitted. Statistics retain normal page layout. */

.meter{background:var(--meter-background,rgba(14,19,23,.7));border-color:var(--meter-border,#ffffff1c);box-shadow:0 7px 22px var(--meter-shadow,#0003)}

.meter[data-style="iracing"] .digit{width:27px}
.meter[data-style="iracing"] .group{margin-left:6px}

/* Shared appearance preferences live beside mileage, without altering totals. */
(function(root){

/* Four styles share the same measured distance; visuals never change totals. */
window.createOdometerRenderer = function(meter){
 'use strict';

 var digits=meter.querySelector('.digits'),cells=[],shown='',active=null,style='minimal';
 var latest={meters:0,car_key:null},displayed=0,from=0,target=0,startAt=0,duration=110,lastInput=0,frame=null,destroyed=false;
 var rareTimer=null,rareGate=function(){return Promise.resolve(true);};
 var reduced=window.matchMedia('(prefers-reduced-motion: reduce)');
 var glyphs=[
 ['01110','10001','10011','10101','11001','10001','01110'],
 ['00100','01100','00100','00100','00100','00100','01110'],
 ['01110','10001','00001','00010','00100','01000','11111'],
 ['11110','00001','00001','01110','00001','00001','11110'],
 ['00010','00110','01010','10010','11111','00010','00010'],
 ['11111','10000','10000','11110','00001','00001','11110'],
 ['01110','10000','10000','11110','10001','10001','01110'],
 ['11111','00001','00010','00100','01000','01000','01000'],
 ['01110','10001','10001','01110','10001','10001','01110'],
 ['01110','10001','10001','01111','00001','00001','01110']
 ];
 function textFor(meters){var value=Math.floor(meters/100);return String(Math.floor(value/10)).padStart(6,'0')+'.'+value%10;}
 function clearCells(){cells.forEach(function(c){if(c)clearTimeout(c.timer);});cells=[];digits.innerHTML='';shown='';}
 function makeStrip(el,text,height){
   var strip=document.createElement('span');strip.className='strip';
   var a=document.createElement('span'),b=document.createElement('span');a.textContent=text;b.textContent=text;
   strip.appendChild(a);strip.appendChild(b);el.appendChild(strip);
   return {strip:strip,a:a,b:b,timer:null,height:height};
 }
 function roll(cell,value,previous,instant){
   clearTimeout(cell.timer);cell.strip.classList.remove('animate');cell.strip.style.transform='translateY(0)';
   cell.a.textContent=instant?value:previous;cell.b.textContent=value;
   if(!instant&&!reduced.matches){

   }
 }
 function build(text){
   clearCells();
   for(var i=0;i<text.length;i++){
     var el=document.createElement('span');
     if(text[i]==='.'){

       if(i===text.length-1){

         for(var row=-1;row<=10;row++){var num=document.createElement('span');num.textContent=(row+10)%10;strip.appendChild(num);}

       }else cells.push(makeStrip(wheel,text[i],42));

 function paint(meters,instant){
   var text=textFor(meters);

   for(var i=0;i<text.length;i++){
     var c=cells[i];if(!c)continue;
     if(style==='electronic'){
       if(instant||text[i]!==shown[i]){

         if(!candidates.length)return;
         var cell=candidates[Math.floor(Math.random()*candidates.length)];
         var litRows=[];
         for(var row=0;row<7;row++)if(cell.dots.slice(row*5,row*5+5).some(function(dot){return dot.classList.contains('lit');}))litRows.push(row);
         var chosen=litRows[Math.floor(Math.random()*litRows.length)];
         cell.dots.slice(chosen*5,chosen*5+5).forEach(function(dot){if(dot.classList.contains('lit'))dot.classList.add('pixel-rare');});
         setTimeout(function(){cell.dots.forEach(function(dot){dot.classList.remove('pixel-rare');});},350);
       }).catch(function(e){console.error('Odometer pixel effect:',e);});
     }
     scheduleRare();
   },300000+Math.floor(Math.random()*300000));
 }
 render.setStyle=function(value){
   if(['minimal','electronic','mechanical','iracing'].indexOf(value)<0)value='minimal';
   if(value===style&&cells.length)return;
   style=value;meter.dataset.style=style;
   if(frame)cancelAnimationFrame(frame);frame=null;clearCells();
   displayed=target=latest.meters;lastInput=0;paint(latest.meters,true);
 };
 render.setBackground=function(color,opacity){
   var hex=/^#[0-9a-f]{6}$/i.test(color)?color:'#0e1317';
   var alpha=Number.isFinite(opacity)?Math.max(0,Math.min(100,opacity))/100:.7;
   var rgb=[1,3,5].map(function(start){return parseInt(hex.slice(start,start+2),16);});
   meter.style.setProperty('--meter-background','rgba('+rgb.join(',')+','+alpha+')');
   meter.style.setProperty('--meter-border','rgba(255,255,255,'+(alpha*.16)+')');
   meter.style.setProperty('--meter-shadow','rgba(0,0,0,'+(alpha*.286)+')');
 };
 render.setFlickerGate=function(gate){rareGate=gate;};
 render.destroy=function(){destroyed=true;if(frame)cancelAnimationFrame(frame);clearTimeout(rareTimer);clearCells();};
 render.getStyle=function(){return style;};
 meter.dataset.style=style;scheduleRare();
 return render;
};

/* Fit only the driving widget to the pixel rectangle assigned by Kapps. */
window.fitOdometerToWindow = function(meter){

   pending=null;if(disposed)return;

(function () {
  var render = window.createOdometerRenderer();
  if (new URLSearchParams(location.search).get('manage') !== '1') window.fitOdometerToWindow(document.querySelector('.meter'));
  render({meters: 0, car_key: null});
  if (new URLSearchParams(location.search).get('demo') === '1') {
    var meters = 1234500;
    render.setStyle(new URLSearchParams(location.search).get('style') || 'minimal');
    render({meters: meters, car_key: 'demo'});
    setInterval(function () { meters += 3; render({meters: meters, car_key: 'demo'}); }, 100);
