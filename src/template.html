<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>iRacing · Car odometer</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:transparent;color:#f1f5f5;font-family:Segoe UI,Arial,sans-serif}body{padding:8px}.meter{width:350px;padding:15px 18px 12px;border:1px solid #ffffff1c;border-radius:12px;background:rgba(14,19,23,.70);box-shadow:0 7px 22px #0003;position:relative;overflow:hidden}.meter:before{content:"";position:absolute;left:0;top:21px;bottom:21px;width:3px;background:#a8ddba;border-radius:2px}.reading{display:flex;align-items:baseline;gap:10px}.digits{display:flex;align-items:flex-end;font-family:Consolas,monospace;font-size:36px;font-weight:400;line-height:44px;height:44px;font-variant-numeric:tabular-nums}.digit{width:22px;height:44px;overflow:hidden;position:relative}.strip{display:block;transform:translateY(0);will-change:transform}.strip.animate{transition:transform 260ms cubic-bezier(.2,.7,.25,1)}.strip span{display:block;height:44px;line-height:44px;text-align:center}.digit:last-child{color:#a8ddba}.point{width:12px;text-align:center}.group{margin-left:7px}.unit{font-size:12px;color:#8c999e;letter-spacing:.08em}.preview-page{background:#171e24;min-height:100vh;padding:70px 30px}.preview-wrap{max-width:740px;margin:0 auto}.intro{margin-bottom:32px}.intro small{color:#a8ddba;font-size:10px;letter-spacing:.25em}.intro h1{font-weight:400;font-size:32px;letter-spacing:-.03em;margin:15px 0 10px}.intro p{font-size:14px;color:#99a7ad;line-height:1.6;max-width:570px}.demo-controls{display:flex;gap:10px;margin-top:26px;flex-wrap:wrap}button{background:#242f36;border:1px solid #3a484e;border-radius:7px;color:#d5e0e1;font:12px Segoe UI,sans-serif;padding:10px 15px;cursor:pointer}button:hover{border-color:#a8ddba}.note{font-size:12px;color:#7e9098;line-height:1.7;margin-top:24px}@media(prefers-reduced-motion:reduce){.strip.animate{transition:none}}
</style></head><body><div id="wrap"><section class="meter" aria-label="Car odometer"><div class="reading"><div class="digits" id="digits" aria-label="0.0 kilometres"></div><span class="unit">km</span></div></section></div>
<!-- SCRIPTS --></body></html>
